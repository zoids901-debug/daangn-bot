name: 당근 즉석검색

# 깃허브 화면 / 웹 패널에서 키워드를 넣어 실행.
# 단일 실행 + 느린 안전속도라 전국이면 2~3시간 걸린다 (차단 회피).
# 급하면 로컬에서 돌리는 게 빠르다 (검색.bat).
on:
  workflow_dispatch:
    inputs:
      keyword:
        description: '검색할 키워드'
        required: true
      region:
        description: '지역 (비우면 전국. 예: 서울,경기)'
        required: false
        default: ''

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 라이브러리 설치
        run: pip install -r requirements.txt
      - name: 즉석검색
        env:
          TELEGRAM_TOKEN:     ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          NOTION_TOKEN:       ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          MAX_WORKERS: '2'
        run: python daangn_search.py --mode search --keyword "${{ inputs.keyword }}" --region "${{ inputs.region }}"
      - name: 검색결과 CSV 첨부
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 검색결과
          path: '*.csv'
          if-no-files-found: ignore
