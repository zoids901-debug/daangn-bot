name: 당근 알림봇 (전국 자동감시)

# 매시 정각(한국시간)마다 자동 실행. 손으로도 실행 가능.
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

# 같은 워크플로우가 겹쳐 돌지 않도록
concurrency:
  group: daangn-watch
  cancel-in-progress: false

# seen.json 을 다시 저장(커밋)하려면 쓰기 권한 필요
permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 라이브러리 설치
        run: pip install -r requirements.txt

      - name: 전국 키워드 검색
        env:
          TELEGRAM_TOKEN:     ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          NOTION_TOKEN:       ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: python daangn_search.py --mode watch

      - name: 본 매물 기록 저장
        run: |
          git config user.name  "daangn-bot"
          git config user.email "actions@github.com"
          git add seen.json
          git commit -m "chore: seen.json 갱신" || echo "변경 없음 — 커밋 생략"
          git push
