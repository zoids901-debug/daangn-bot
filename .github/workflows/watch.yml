name: 당근 알림봇 (주간 전국 감시)

# 매주 월요일 새벽(한국시간) 1회 자동 실행.
# 단일 실행 + 느린 안전속도 — 한 번에 하나만 도니 당근에 차단되지 않는다.
# 지난 한 주 동안 올라온 새 매물을 모아서 텔레그램 알림.
on:
  schedule:
    - cron: '0 21 * * 0'   # 월요일 06:00 KST
  workflow_dispatch:

concurrency:
  group: daangn-watch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 라이브러리 설치
        run: pip install -r requirements.txt
      - name: 전국 감시
        env:
          TELEGRAM_TOKEN:     ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          NOTION_TOKEN:       ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          MAX_WORKERS: '2'   # 차단 안 당하는 안전 속도
        run: python daangn_search.py --mode watch
      - name: 본 매물 기록 저장
        run: |
          git config user.name  "daangn-bot"
          git config user.email "actions@github.com"
          git add seen.json
          git commit -m "chore: seen.json 갱신" || echo "변경 없음 — 커밋 생략"
          git pull --rebase --autostash || true
          git push
