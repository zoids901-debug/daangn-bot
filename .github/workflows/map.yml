name: 지역코드 수집 (region_map 갱신)

# 매주 월요일 새벽 4시(한국시간) 자동 + 손으로도 실행 가능.
# 알림봇/즉석검색의 '전국' 범위가 이 region_map.json 을 기준으로 동작한다.
on:
  schedule:
    - cron: '0 19 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  map:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 라이브러리 설치
        run: pip install -r requirements.txt

      - name: 전국 지역코드 수집
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python daangn_search.py --mode map

      - name: region_map.json 저장
        run: |
          git config user.name  "daangn-bot"
          git config user.email "actions@github.com"
          git add region_map.json
          git commit -m "chore: region_map.json 갱신" || echo "변경 없음 — 커밋 생략"
          git push
